[package]
name = "acheron-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
evdev = { version = "0.13", features = ["serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "p2p"] }

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
tokio = { version = "1.53.1", features = ["test-util"] }
